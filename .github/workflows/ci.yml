name: ci

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: build (Table Derby, local with mock API)
        run: npm run build
        env:
          NEXT_PUBLIC_CMS_WORKSPACE: table-derby
          NEXT_PUBLIC_TD_API_MOCK: "1"
      - name: build (Table Derby, staging shape)
        run: npm run build
        env:
          NEXT_PUBLIC_CMS_WORKSPACE: table-derby
          NEXT_PUBLIC_CMS_ENV: STAGING
          NEXT_PUBLIC_TD_API_URL: https://td-api.invalid
      - name: build (Table Derby, production shape)
        run: npm run build
        env:
          NEXT_PUBLIC_CMS_WORKSPACE: table-derby
          NEXT_PUBLIC_CMS_ENV: PROD
          NEXT_PUBLIC_TD_API_URL: https://td-api.invalid

  td-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The mock runs only in local builds (no NEXT_PUBLIC_CMS_ENV, not on Vercel).
      NEXT_PUBLIC_CMS_WORKSPACE: table-derby
      NEXT_PUBLIC_TD_API_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Installed for this job only, so package.json and the lockfile stay unchanged.
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: smoke (login, roles, navigation, isolation)
        run: |
          npx next start -p 3310 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3310/td/login && break; sleep 1; done
          node scripts/td-smoke.mjs http://localhost:3310
